<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Synapse DCS">
  <defs>
    <linearGradient id="sdcs-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#sdcs-g)" stroke-width="3.2" stroke-linecap="round">
    <!-- presynaptic node and its dendrites -->
    <path d="M19 32 L5 15 M19 32 L3 32 M19 32 L5 49"/>
    <!-- postsynaptic terminal: a cup that receives the signal -->
    <path d="M47 21 C40 25 40 39 47 43"/>
    <path d="M47 32 L61 32 M51 27 L60 16 M51 37 L60 48"/>
  </g>
  <g fill="url(#sdcs-g)">
    <circle cx="19" cy="32" r="8"/>
    <circle cx="5" cy="15" r="3"/>
    <circle cx="3" cy="32" r="2.6"/>
    <circle cx="5" cy="49" r="3"/>
    <circle cx="60" cy="16" r="3"/>
    <circle cx="61" cy="32" r="2.6"/>
    <circle cx="60" cy="48" r="3"/>
  </g>
  <!-- the signal crossing the gap -->
  <g fill="#F59E0B">
    <circle cx="32" cy="25" r="2.4"/>
    <circle cx="35.5" cy="32" r="2.8"/>
    <circle cx="32" cy="39" r="2.4"/>
  </g>
</svg>
